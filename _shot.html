<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Automed capture harness</title>
<style>
  html,body{margin:0;padding:0;background:#fff;overflow:hidden}
  #frame{border:0;display:block;position:fixed;top:0;left:0}
</style>
</head>
<body>
<iframe id="frame"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '1440', 10);
  var h = parseInt(q.get('h') || '1000', 10);
  var theme = q.get('theme');
  var lang = q.get('lang');
  var y = parseInt(q.get('y') || '0', 10);
  var hash = q.get('hash') || '';

  var frame = document.getElementById('frame');
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';

  /* harness is same-origin with index.html: seed the persisted theme *before*
     the page parses, so the inline theme-init script applies it with no transition */
  try {
    if (theme) localStorage.setItem('theme', theme);
    else localStorage.removeItem('theme');
  } catch (e) {}

  frame.addEventListener('load', function(){
    var win = frame.contentWindow, doc = win.document;
    try {
      if (lang && lang !== 'ar') win.toggleLang();
      if (hash) {
        var target = doc.querySelector(hash);
        if (target) y = target.getBoundingClientRect().top + win.scrollY - 80;
      }
      doc.documentElement.style.scrollBehavior = 'auto';
      win.scrollTo(0, Math.max(0, y));
      /* make sure scroll-driven observers have settled */
      win.dispatchEvent(new Event('scroll'));
    } catch (e) { document.title = 'ERR ' + e.message; }
  });

  frame.src = 'index.html';
</script>
</body>
</html>
